# Render Blueprint - Smart Operations Hub [Ref: 24/7 deployment]
# Deploy: Connect repo at render.com, Render will detect this file.
services:
  - type: web
    name: smart-ops-hub-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py seed_brands && python manage.py collectstatic --noinput --clear
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
        # Set in Render dashboard: your-service.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-ops-hub-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
        # Set: https://your-frontend.onrender.com (or Vercel URL)
    healthCheckPath: /api/dashboard/system-health/

  - type: web
    name: smart-ops-hub-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
        # Set: https://smart-ops-hub-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smart-ops-hub-db
    plan: free
    region: oregon
